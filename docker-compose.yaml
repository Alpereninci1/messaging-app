services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: messaging-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - messaging-network
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    container_name: messaging-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: messaging_app
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: messaging_user
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - messaging-network

  redis:
    image: redis:7-alpine
    container_name: messaging-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - messaging-network

  nginx:
    image: nginx:alpine
    container_name: messaging-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - messaging-network
    depends_on:
      - app

volumes:
  db_data:

networks:
  messaging-network:
    driver: bridge